name: Feature request
description: Suggest an improvement (e.g. a new framework adapter).
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that's hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        Note: changes to the *verification algorithm* belong in
        [webhookd-spec](https://github.com/webhookd-lab/webhookd-spec) first, so
        all language SDKs stay compatible.
